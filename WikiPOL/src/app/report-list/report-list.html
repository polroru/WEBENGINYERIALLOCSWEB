<h1>Reports</h1>

<p class="total-reports">
  Reports trobats: {{ total }}
</p>

<div class="reports-container">
  @if(loading()) {
    <div class="loading">
      Carregant reports...
    </div>
  } @else {
    @for (report of reports(); track report._id) {
      <div
        class="report-card"
        (click)="openArticle(report._id)"
      >
        <!-- Títol de l'article -->
        <h2>{{ report.articleTitle }}</h2>

        <!-- Comentari del report, alineat -->
        <p>{{ report.comment }}</p>

        <!-- Metadades: creador -->
        <small>Creat per: {{ report.creatBy }}</small>

        <!-- ESTADO: en rojo si no està solucionat, en verd si està solucionat -->
        <small class="report-state" [class.solved]="report.state === 'solved'">
          Estat: {{ report.state }}
        </small>
      </div>
    }
  }
</div>

<!-- PAGINACIÓ -->
@if(!loading()) {
  <div class="pagination">
    <button
      (click)="prevPage()"
      [disabled]="page === 1"
    >
      ⬅ Anterior
    </button>

    <span>Pàgina {{ page }}</span>

    <button
      (click)="nextPage()"
      [disabled]="page * limit >= total"
    >
      Següent ➡
    </button>
  </div>
}
