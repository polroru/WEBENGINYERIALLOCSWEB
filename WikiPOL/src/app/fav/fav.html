<h1>Favorits</h1>

<div class="articles-container">
  @if (articles() && articles().length > 0) {
    @for (article of articles(); track article._id) {
      <div class="article-card" (click)="openArticle(article._id)">
        <h2>{{ article.title }}</h2>
        <p>{{ article.content }}</p>
      </div>
    }
  } @else {
    <p class="no-favorites">No tens articles favorits.</p>
  }
</div>
